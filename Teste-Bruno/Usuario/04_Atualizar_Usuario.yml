  body:
    type: json
    data: |-
      {
        "nome": "Lucas Teste Atualizado",
        "email": "lucas.teste.001@sportflow.test",
        "telefone": "11888888888",
        "ativo": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("retorna 200 com os dados atualizados", function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("usuarioId"));
          expect(res.body.nome).to.equal("Usuario Bruno Atualizado");
          expect(res.body.telefone).to.equal("11888888888");
          expect(res.body.ativo).to.equal(false);
          expect(res.body).to.not.have.property("senha");
        });

