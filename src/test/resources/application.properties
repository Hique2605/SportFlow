# Testes rodam em banco H2 em memória.
# O Flyway fica desligado aqui porque a migration V1.1 usa "CREATE TYPE ... AS ENUM",
# recurso exclusivo do PostgreSQL. O Hibernate cria as tabelas a partir das entidades.
spring.datasource.url=jdbc:h2:mem:sportflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Nos testes o encerramento automático não roda sozinho: o teste chama o método direto
sportflow.agendador.ativo=false
sportflow.fuso-horario=America/Sao_Paulo

jwt.secret=segredo-usado-somente-nos-testes-automatizados-123
