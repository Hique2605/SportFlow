spring.application.name=SportFlow

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/sportflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
# Permite aplicar a V1.2 em bancos locais que já tenham uma versão maior aplicada
# (ex.: um script V2 que rodou localmente e não está no repositório).
spring.flyway.out-of-order=true

# Fuso dos estabelecimentos: usado para saber se uma reserva já começou/terminou
sportflow.fuso-horario=America/Sao_Paulo

# Encerramento automático das reservas que já passaram
# (CONFIRMADO -> CONCLUIDO, PENDENTE -> CANCELADO). Intervalos em milissegundos.
sportflow.agendador.ativo=true
sportflow.agendador.atraso-inicial-ms=30000
sportflow.agendador.intervalo-ms=300000

# Assistente de IA (LangChain4j + Google Gemini)
# A chave vem da variável de ambiente GEMINI_API_KEY (crie em https://aistudio.google.com/apikey).
# Sem chave, o resto do sistema funciona e o assistente responde 503.
sportflow.ia.api-key=${GEMINI_API_KEY:}
# Alternativa à variável de ambiente: arquivo ia-local.properties na raiz do projeto
# (fora do git, ver .gitignore) com a linha sportflow.ia.api-key=SUA_CHAVE
spring.config.import=optional:file:./ia-local.properties
# gemini-3.5-flash-lite: rápido e estável no plano gratuito (em 27/11 o 3.8-flash estava com "high demand")
sportflow.ia.modelo=gemini-3.5-flash-lite
# Usado automaticamente se o principal falhar (ex.: 503 "high demand" do Google). Vazio = sem reserva.
sportflow.ia.modelo-reserva=gemini-3.8-flash
sportflow.ia.temperatura=0.2
sportflow.ia.timeout-segundos=25
# true = mostra no console o que é enviado/recebido do Gemini (bom para apresentar/depurar)
sportflow.ia.log-requisicoes=false

