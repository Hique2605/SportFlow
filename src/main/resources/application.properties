spring.application.name=SportFlow

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/sportflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

# JWT - sobrescreva em ambientes compartilhados e de producao.
security.jwt.secret=${JWT_SECRET:development-only-secret-change-me-32-bytes}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
