runtime:
  scripts:
    - type: tests
      code: |-
        test("retorna 200 e o usuario correto", function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("usuarioId"));
          expect(res.body.email).to.equal(bru.getVar("usuarioEmail"));
          expect(res.body).to.not.have.property("senha");
        });

